version: "3.8"

services:
  logstash:
    image: cmp-logstash:latest
    env_file:
      - logstash.env
    ports:
      - "${LOGSTASH_PORT}:9600"
    volumes:
      - ../shared/certs/ca/ca.crt:/usr/share/logstash/config/certs/ca.crt:ro
      - ../shared/certs/logstash/logstash.crt:/usr/share/logstash/config/certs/logstash.crt:ro
      - ../shared/certs/logstash/logstash.key:/usr/share/logstash/config/certs/logstash.key:ro
      - logstashdata:/usr/share/logstash/data
      - ./sample_data/previously_searched_sample.json:/usr/share/logstash/input/previously_searched_sample.json
      - ./sample_data/search_suggestion_sample.json:/usr/share/logstash/input/search_suggestion_sample.json
      - ./sample_data/product_search_sample.json:/usr/share/logstash/input/product_search_sample.json
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_URL}
      - CA_CERTIFICATE_PATH=${CA_CERTIFICATE_PATH}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}

      - PREVIOUSLY_SEARCHED_ITEM_TEMPLATE_NAME=${PREVIOUSLY_SEARCHED_ITEM_TEMPLATE_NAME}
      - PREVIOUSLY_SEARCHED_ITEM_INDEX_NAME=${PREVIOUSLY_SEARCHED_ITEM_INDEX_NAME}

      - SEARCH_SUGGESTION_TEMPLATE_NAME=${SEARCH_SUGGESTION_TEMPLATE_NAME}
      - SEARCH_SUGGESTION_INDEX_NAME=${SEARCH_SUGGESTION_INDEX_NAME}

      - PRODUCT_SEARCH_TEMPLATE_NAME=${PRODUCT_SEARCH_TEMPLATE_NAME}
      - PRODUCT_SEARCH_INDEX_NAME=${PRODUCT_SEARCH_INDEX_NAME}

      - PAGE_SIZE=${PAGE_SIZE}
    networks:
      - cmp-elastic
    stdin_open: true
    tty: true
    command: >
      bash -c '
        echo -n "Checking ${PREVIOUSLY_SEARCHED_ITEM_INDEX_NAME}...";
        if ! curl -s -I --cacert ${CA_CERTIFICATE_PATH} -u "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" ${ELASTICSEARCH_URL}/${PREVIOUSLY_SEARCHED_ITEM_INDEX_NAME} | grep -i -q "HTTP/1.1 200 OK"; then
          echo "Not found";
          echo "Creating ${PREVIOUSLY_SEARCHED_ITEM_INDEX_NAME}";
          curl -X PUT --cacert ${CA_CERTIFICATE_PATH} -u "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" "${ELASTICSEARCH_URL}/${PREVIOUSLY_SEARCHED_ITEM_INDEX_NAME}" -H "Content-Type: application/json" -d @templates/${PREVIOUSLY_SEARCHED_ITEM_INDEX_TEMPLATE_FILE}
        else
          echo "Ok"
        fi
        echo -n "Checking ${SEARCH_SUGGESTION_INDEX_NAME}...";
        if ! curl -s -I --cacert ${CA_CERTIFICATE_PATH} -u "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" ${ELASTICSEARCH_URL}/${SEARCH_SUGGESTION_INDEX_NAME} | grep -i -q "HTTP/1.1 200 OK"; then
          echo "Not found";
          echo "Creating ${SEARCH_SUGGESTION_INDEX_NAME}";
          curl -X PUT --cacert ${CA_CERTIFICATE_PATH} -u "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" "${ELASTICSEARCH_URL}/${SEARCH_SUGGESTION_INDEX_NAME}" -H "Content-Type: application/json" -d @templates/${SEARCH_SUGGESTION_ITEM_INDEX_TEMPLATE_FILE}
        else
          echo "Ok"
        fi
        echo -n "Checking ${PRODUCT_SEARCH_INDEX_NAME}...";
        if ! curl -s -I --cacert ${CA_CERTIFICATE_PATH} -u "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" ${ELASTICSEARCH_URL}/${PRODUCT_SEARCH_INDEX_NAME} | grep -i -q "HTTP/1.1 200 OK"; then
          echo "Not found";
          echo "Creating ${PRODUCT_SEARCH_INDEX_NAME}";
          curl -X PUT --cacert ${CA_CERTIFICATE_PATH} -u "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" "${ELASTICSEARCH_URL}/${PRODUCT_SEARCH_INDEX_NAME}" -H "Content-Type: application/json" -d @templates/${PRODUCT_SEARCH_INDEX_TEMPLATE_FILE}
        else
          echo "Ok"
        fi
        echo "Injecting sample data..."
        bin/logstash

      '

volumes:
  logstashdata:
    driver: local

networks:
  cmp-elastic:
