input {
	file {
		path => "/usr/share/logstash/input/search_suggestion_sample.json"
		start_position => "beginning"
		sincedb_path => "/dev/null"
		codec => json
		ecs_compatibility => "disabled"
	}
}

filter {
	# Add error handling for malformed JSON
	if [message] {
		mutate {
			remove_field => ["message"]
		}
	}

	mutate {
		remove_field => ["host", "log", "event"]
	}

	ruby {
	code => '
		# Increment search_count
		count = event.get("search_count") || 0
		event.set("search_count", count + 1)

		# Set timestamps
		now = Time.now.utc.strftime("%Y-%m-%dT%H:%M:%S.%LZ")
		event.set("updated_at", now)

		# Set the document Id
        type = event.get("type")
        name = event.get("name")
        
        # Create a deterministic ID based on the suggestion content
        if type == "product" && event.get("product_id")
			# For products, use product_id to ensure uniqueness
			id = "product-#{event.get("product_id")}"
        elsif type == "category" && event.get("category_id")
			# For categories, use category_id
			id = "category-#{event.get("category_id")}"
        else
			# For generic suggestions, hash the name
			# This ensures the same suggestion text always gets the same ID
			require "digest"
			normalized_name = name.to_s.downcase.strip
			id = "suggestion-#{Digest::MD5.hexdigest(normalized_name)}"
        end
        
		# Ensure tags is always an array
		tags = event.get("tags")
		if tags.nil? || !tags.is_a?(Array)
			event.set("tags", [])
		end
			
		# Ensure other fields have proper defaults
		event.set("is_bestseller", event.get("is_bestseller") || false)
		event.set("new_arrival", event.get("new_arrival") || false)
		event.set("is_featured", event.get("is_featured") || false)
		event.set("in_stock", event.get("in_stock") || false)
		event.set("discount", event.get("discount") || 0.0)

        # Set the ID in the event
		event.set("doc_id", id)
	'
	}
}

output {
stdout { codec => rubydebug }
	elasticsearch {
		"hosts" => "${ELASTICSEARCH_HOSTS}"
		"user" => "${ELASTICSEARCH_USERNAME}"
		"password" => "${ELASTICSEARCH_PASSWORD}"
		"index" => "${SEARCH_SUGGESTION_INDEX_NAME}"
		"document_id" => "%{doc_id}"
		"ssl_enabled" => true
		"ssl_certificate_authorities" => "${CA_CERTIFICATE_PATH}"
		"action" => "update"
		"doc_as_upsert" => true
		"manage_template" => false
	}
}
